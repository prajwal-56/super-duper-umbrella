<!doctype html>
<html>
<head><meta charset="utf-8"><title>Invoices</title></head>
<body class="ledger-sheet">
<header><h1>Invoices</h1><nav> / <a href="/app">dashboard</a></nav></header>
<main>
<table>
<thead><tr><th>Number</th><th>Period</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead>
<tbody>
{% for inv in invoices %}
<tr><td>{{ inv.number }}</td><td>{{ inv.period_start }} - {{ inv.period_end }}</td><td>{{ inv.total_minor|fmt }}</td><td>{{ inv.status }}</td><td><a href="/app/invoices/{{ inv.id }}">View</a> {% if inv.status == 'draft' %}<form method="post" action="/app/invoices/{{ inv.id }}/confirm"><button>Confirm</button></form>{% endif %}</td></tr>
{% endfor %}
</tbody>
</table>
</main>
<footer>FOLIO app/invoices · set in {{ request_time }} ms</footer>
</body>
</html>
