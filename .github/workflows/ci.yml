name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brightloop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brightloop"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brightloop
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brightloop_test
      SECRET_KEY: ci-only-secret
      APP_BASE_URL: http://localhost:8000
      DEMO_MODE: "false"
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: Admin#12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE brightloop_test"
      - name: Migrate
        run: python -m app.migrate
      - name: Lint
        run: python -m ruff check .
      - name: Style lint
        run: python scripts/style_lint.py
      - name: Stub report
        run: python scripts/check_stubs.py --report
      - name: Tests
        run: python -m pytest -q
